<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5f7f63" />
    <title>Offline | CoinLeaf</title>
    <link rel="stylesheet" href="/offline.css" />
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1>You are offline</h1>
      <p>CoinLeaf needs a connection to show your latest numbers. Check your internet and try again.</p>
      <a class="retry" href="/dashboard">Try again</a>
      <form id="offline-add" class="add" aria-label="Add an entry while offline">
        <h2>Add something now</h2>
        <p class="hint">It is kept on this device and sent when you are back online.</p>
        <label>Type
          <select name="type"><option value="expense">Expense</option><option value="income">Income</option></select>
        </label>
        <label>Amount
          <input name="amount" type="number" inputmode="decimal" min="0" step="any" required />
        </label>
        <label id="offline-category-label">Category (optional)
          <select name="category"><option value="">No category</option></select>
        </label>
        <label id="offline-source-label" hidden>Income source (optional)
          <select name="source"><option value="">No source</option></select>
        </label>
        <p id="offline-lists-hint" class="hint" hidden>Your categories show here once you have opened CoinLeaf online on this device.</p>
        <label>Date
          <input name="date" type="date" required />
        </label>
        <label>Note (optional)
          <input name="note" maxlength="500" />
        </label>
        <button type="submit">Save on this device</button>
        <p id="offline-msg" role="status"></p>
      </form>
      <script src="/offline.js"></script>
    </main>
  </body>
</html>
